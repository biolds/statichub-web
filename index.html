<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StaticHub — Package Ecosystem</title>
    <meta name="description" content="Browse and install static web applications from the StaticHub package ecosystem" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var preferred = saved
          ? saved
          : window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        if (preferred === "light") {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a href="#home" class="brand" aria-label="StaticHub home">
          <img src="./icon.svg" class="brand-icon" alt="" aria-hidden="true" />
          <span class="eyebrow">StaticHub</span>
        </a>
        <nav class="topnav" aria-label="Main navigation">
          <a href="#catalog" class="nav-link" id="nav-catalog">Packages</a>
        </nav>
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Switch to light mode"
          title="Toggle light/dark mode"
        >
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </header>

      <main id="main" aria-live="polite"></main>
    </div>

    <!-- Home view template -->
    <template id="view-home">
      <section class="hero">
        <h1 class="hero-title">Self-hosted <em>static</em> apps, one command away</h1>
        <p class="hero-lede">StaticHub lets you install, update, and run offline-capable static web applications from a curated package registry — no server required.</p>
        <a href="#catalog" class="cta-btn">Browse Packages</a>
      </section>

      <section class="features">
        <div class="feature-card">
          <div class="feature-icon" aria-hidden="true">📦</div>
          <h2 class="feature-title">Curated Registry</h2>
          <p class="feature-body">A growing catalog of offline-capable static apps, each verified and packaged for easy installation.</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon" aria-hidden="true">⚡</div>
          <h2 class="feature-title">One-Line Install</h2>
          <p class="feature-body">Install any package with a single CLI command. No Docker, no Node, no runtime dependencies.</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon" aria-hidden="true">🔒</div>
          <h2 class="feature-title">Offline First</h2>
          <p class="feature-body">Every installed app runs entirely in your browser. Your data stays on your machine.</p>
        </div>
      </section>

      <section class="install-section">
        <h2 class="section-title">Get Started</h2>
        <p class="section-lede">Install the CLI with a single Go command, then use it to install packages.</p>
        <div class="code-block">
          <code class="code-text">go install github.com/biolds/statichub-cli@latest</code>
          <button class="copy-btn" data-copy="go install github.com/biolds/statichub-cli@latest" aria-label="Copy install command">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="copy-label">Copy</span>
          </button>
        </div>
        <div class="code-block">
          <code class="code-text">statichub install security/cyberchef</code>
          <button class="copy-btn" data-copy="statichub install security/cyberchef" aria-label="Copy example install command">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="copy-label">Copy</span>
          </button>
        </div>
      </section>

      <section class="links-section">
        <h2 class="section-title">Explore the Source</h2>
        <div class="links-row">
          <a href="https://github.com/biolds/statichub-cli" class="link-card" target="_blank" rel="noopener noreferrer">
            <svg class="gh-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.11.82-.26.82-.57v-2c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.32-1.75-1.32-1.75-1.08-.74.08-.73.08-.73 1.2.09 1.83 1.23 1.83 1.23 1.06 1.82 2.78 1.3 3.46.99.1-.77.41-1.3.75-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.21.69.82.57C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
            statichub-cli
          </a>
          <a href="https://github.com/biolds/statichub-pkg" class="link-card" target="_blank" rel="noopener noreferrer">
            <svg class="gh-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.11.82-.26.82-.57v-2c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.32-1.75-1.32-1.75-1.08-.74.08-.73.08-.73 1.2.09 1.83 1.23 1.83 1.23 1.06 1.82 2.78 1.3 3.46.99.1-.77.41-1.3.75-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.21.69.82.57C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
            statichub-pkg
          </a>
        </div>
      </section>
    </template>

    <!-- Catalog view template -->
    <template id="view-catalog">
      <div class="catalog-controls">
        <label class="search" for="search-input">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            id="search-input"
            type="search"
            name="search"
            placeholder="Search by title, description, tag, or path"
            autocomplete="off"
            aria-label="Search packages"
          />
        </label>
        <div class="sort-row">
          <span class="sort-label">Sort:</span>
          <button class="sort-btn active" data-sort="alpha" aria-pressed="true">A–Z</button>
          <button class="sort-btn" data-sort="stars" aria-pressed="false">Stars</button>
        </div>
      </div>
      <section class="status-panel" aria-live="polite">
        <p id="status-copy" class="status-copy"></p>
        <p id="status-meta" class="status-meta"></p>
      </section>
      <section id="card-grid" class="card-grid" aria-live="polite"></section>
    </template>

    <!-- Package card template -->
    <template id="card-template">
      <article class="card" tabindex="0" role="button">
        <div class="card-head">
          <div class="icon-slot" aria-hidden="true"></div>
          <div class="card-title-wrap">
            <h2 class="card-title"></h2>
            <p class="card-path"></p>
          </div>
        </div>
        <p class="card-description"></p>
        <div class="card-tags"></div>
        <div class="card-footer">
          <span class="card-version"></span>
          <span class="card-stars"></span>
        </div>
      </article>
    </template>

    <!-- Detail view template -->
    <template id="view-detail">
      <div class="detail-wrap">
        <a href="#catalog" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Back to catalog
        </a>
        <article class="detail-card">
          <div class="detail-head">
            <div class="icon-slot large" aria-hidden="true"></div>
            <div class="detail-title-wrap">
              <h1 class="detail-title"></h1>
              <p class="detail-path"></p>
              <div class="detail-badges"></div>
            </div>
          </div>
          <p class="detail-description"></p>
          <div class="detail-tags"></div>

          <div class="install-block">
            <h2 class="install-label">Install</h2>
            <div class="code-block">
              <code class="code-text detail-install-cmd"></code>
              <button class="copy-btn detail-copy-btn" aria-label="Copy install command">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span class="copy-label">Copy</span>
              </button>
            </div>
          </div>

          <dl class="detail-meta"></dl>

          <div class="detail-links"></div>

          <div class="detail-readme" style="display:none;">
            <h2>README</h2>
            <div class="readme-content"></div>
            <button class="readme-toggle" style="display:none;"></button>
          </div>
        </article>
      </div>
    </template>

    <script src="./marked.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
