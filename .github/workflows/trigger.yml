name: Trigger pkg deploy

on:
  push:
    branches:
      - main
    paths:
      - "icon.svg"
      - "index.html"
      - "styles.css"
      - "app.js"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pkg unified deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/biolds/statichub-pkg/actions/workflows/staticweb.yml/dispatches \
            -d '{"ref":"main"}'
